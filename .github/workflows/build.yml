name: build-installers

# Build double-click installers for Windows (.exe) and macOS (.dmg).
# Trigger by pushing a version tag (git tag v1.0.1 && git push --tags)
# or manually from the Actions tab (Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# needed so the workflow can publish a Release with the installers attached
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: audioedit-windows
            bundle_glob: src-tauri/target/release/bundle/nsis/*-setup.exe
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: ""
            bundles: nsis
          # Same app, built against CUDA torch so forced alignment runs on the
          # GPU. That step is 100% wav2vec2 forward pass and measured 59.8x
          # faster there — 29 minutes down to about one for a 50-minute file —
          # with word boundaries identical to the CPU build (0.0ms across 225
          # words), which matters because those boundaries are where cuts land.
          # It is a separate installer rather than the default because CUDA
          # torch is 4.2GB installed: machines without an NVIDIA card would
          # download all of it and get nothing.
          - os: windows-latest
            artifact: audioedit-windows-gpu
            bundle_glob: src-tauri/target/release/bundle/nsis/*-setup.exe
            torch_index: https://download.pytorch.org/whl/cu128
            suffix: "-gpu"
            bundles: nsis
          - os: macos-latest
            artifact: audioedit-macos
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: ""
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps (torch from ${{ matrix.torch_index }})
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url ${{ matrix.torch_index }}
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Freeze backend (PyInstaller)
        working-directory: backend
        run: pyinstaller --noconfirm audioedit-backend.spec

      - name: Install frontend deps
        run: npm ci

      # Only the formats actually shipped. tauri.conf.json says "all", which
      # also builds an .msi nobody downloads — and WiX cannot package the GPU
      # bundle at all: `light.exe` ran for nine minutes and failed, taking the
      # whole job with it before NSIS was even reached (2026-08-24).
      - name: Build app (bundles the sidecar)
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # Both Windows jobs produce a file with the SAME name. They run on
      # separate runners so nothing clashes there, but they attach to one
      # Release — where the second upload would quietly replace the first.
      - name: Set the GPU installer apart by name
        if: matrix.suffix != ''
        shell: bash
        run: |
          shopt -s nullglob
          for f in ${{ matrix.bundle_glob }}; do
            mv "$f" "${f%-setup.exe}${{ matrix.suffix }}-setup.exe"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

      # On a version tag, publish a Release with the installer attached so
      # non-technical users can download from one simple page (no Actions/zip).
      - name: Attach installer to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundle_glob }}
          fail_on_unmatched_files: true
          body: |
            ## ดาวน์โหลดตัวติดตั้ง

            | ไฟล์ | ใช้กับ |
            |---|---|
            | `..._x64-setup.exe` | **Windows ทั่วไป** — เลือกตัวนี้ถ้าไม่แน่ใจ |
            | `..._x64-gpu-setup.exe` | Windows ที่มีการ์ดจอ NVIDIA |
            | `....dmg` | Mac |

            **ตัว `-gpu` ต่างกันแค่เรื่องความเร็ว** — ขั้นตอน "ตรึงบท"
            ใช้การ์ดจอแทน CPU จากราว 29 นาทีเหลือราว 1 นาที
            (ไฟล์เสียง 50 นาที) ผลลัพธ์เหมือนกันทุกประการ ตำแหน่งคำไม่ขยับ
            แม้แต่มิลลิวินาทีเดียว

            ไฟล์ใหญ่กว่ามากเพราะต้องฝังไลบรารีการ์ดจอไปด้วย
            **เครื่องที่ไม่มีการ์ดจอ NVIDIA ให้ใช้ตัวธรรมดา** ลงตัว `-gpu`
            ไปก็ไม่ได้เร็วขึ้น

            วิธีติดตั้งแบบละเอียด (ภาษาชาวบ้าน): ดู [ติดตั้ง.md](https://github.com/songthegemini-prog/audioedit/blob/main/%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87.md)
